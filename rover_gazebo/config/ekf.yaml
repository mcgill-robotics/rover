frequency: 50  # Hz
sensor_timeout: 0.1
two_d_mode: false  # If your robot operates only on a 2D plane

# Wheel odometry (from /rover_velocity_controller/odom)
odom0: /rover_velocity_controller/odom
odom0_config: [false, false, false,
              false, false, false,
              true, true, false,
              false, false, true,
              false, false, false]
odom0_differential: false
odom0_relative: false

# IMU (from /imu/data)
imu0: /imu/data
imu0_config: [false, false, false,
             true, true, true,
             false, false, false,
             true, true, true,
             true, false, false]
imu0_differential: false
imu0_relative: false
imu0_remove_gravitational_acceleration: true

# World frame and base frame
world_frame: map
base_link_frame: base_footprint
odom_frame: odom
